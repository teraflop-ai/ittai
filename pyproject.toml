[project]
name = "megakernels"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Enrico Shippole", email = "enricoship@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "nvidia-cutlass-dsl[cu13]>=4.8.1",
    "nvidia-ml-py>=13.615.71",
    "pillow>=13.0.0",
    "quack-kernels[cu13]>=0.6.5",
    "requests>=2.28.1",
    "torch>=2.15.0",
    "transformers>=5.21.0",
]

[project.scripts]
megakernels = "megakernels:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
